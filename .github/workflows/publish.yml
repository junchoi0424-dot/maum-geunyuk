name: publish

on:
  schedule:
    - cron: "0 12 * * *" # 21:00 KST (GitHub 스케줄은 수 분~수십 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      id:
        description: "특정 글 id (비우면 다음 미게시 글)"
        required: false
      dry_run:
        description: "dry-run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          args=()
          [ -n "${{ inputs.id }}" ] && args+=(--id "${{ inputs.id }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--check-urls)
          python3 scripts/publish.py "${args[@]}"
      - name: Commit published.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "published: $(python3 -c 'import json;print(json.load(open("published.json"))[-1]["id"])')"
          git push
